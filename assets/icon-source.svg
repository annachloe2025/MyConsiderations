<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect x="0" y="0" width="180" height="180" rx="40" fill="#5e35b1"/>

  <!-- Notebook body -->
  <rect x="50" y="35" width="90" height="120" rx="4" fill="#ffffff"/>

  <!-- Spiral binding (top metal hooks) -->
  <rect x="58" y="28" width="6" height="14" rx="3" fill="#bdbdbd"/>
  <rect x="78" y="28" width="6" height="14" rx="3" fill="#bdbdbd"/>
  <rect x="98" y="28" width="6" height="14" rx="3" fill="#bdbdbd"/>
  <rect x="118" y="28" width="6" height="14" rx="3" fill="#bdbdbd"/>

  <!-- Holes through notebook -->
  <circle cx="61" cy="42" r="2.5" fill="#5e35b1"/>
  <circle cx="81" cy="42" r="2.5" fill="#5e35b1"/>
  <circle cx="101" cy="42" r="2.5" fill="#5e35b1"/>
  <circle cx="121" cy="42" r="2.5" fill="#5e35b1"/>

  <!-- Rule lines on notebook -->
  <line x1="62" y1="68" x2="128" y2="68" stroke="#b39ddb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="62" y1="83" x2="128" y2="83" stroke="#b39ddb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="62" y1="98" x2="128" y2="98" stroke="#b39ddb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="62" y1="113" x2="128" y2="113" stroke="#b39ddb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="62" y1="128" x2="115" y2="128" stroke="#b39ddb" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pencil resting alongside (vertical, on right) -->
  <g transform="translate(150, 50)">
    <!-- Eraser (pink) -->
    <rect x="-5" y="-12" width="10" height="12" rx="1" fill="#ec407a"/>
    <!-- Metal band -->
    <rect x="-5" y="-3" width="10" height="2.5" fill="#9e9e9e"/>
    <!-- Pencil body (yellow) -->
    <rect x="-5" y="0" width="10" height="80" fill="#ffc107"/>
    <!-- Pencil body shadow side -->
    <rect x="-5" y="0" width="3" height="80" fill="#ffa000"/>
    <!-- Wood tip -->
    <polygon points="-5,80 0,95 5,80" fill="#fff8e1"/>
    <!-- Lead point -->
    <polygon points="-2,90 0,95 2,90" fill="#3a1f6e"/>
  </g>
</svg>
